version: "3.8"

services:
  fhir-api:
    build:
      context: modules/fhir_mock_api
      dockerfile: Dockerfile
    container_name: fhir_mock_api_service
    ports:
      - "9123:9123"
    volumes:
      - ./modules/fhir_mock_api:/app
      - /app/.venv
    environment:
      - HOST=0.0.0.0
      - PORT=9123
      - CORS_ORIGIN=*
    networks:
      - mock-hospital-net

  harness:
    build:
      context: modules/harness_fhir
      dockerfile: Dockerfile
    container_name: harness_fhir_service
    ports:
      - "5173:5173"
    volumes:
      - ./modules/harness_fhir:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:9123
    depends_on:
      - fhir-api
    networks:
      - mock-hospital-net

networks:
  mock-hospital-net:
    driver: bridge
